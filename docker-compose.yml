services:
#--- PostgreSQL con timescaledb ---
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres_db
    ports:
      - "5432:5432"
    volumes:
      - ./timescale_data:/var/lib/postgresql/data
#--- MongoDB ---
  mongo:
      image: mongo:latest
      container_name: mongo_db
      restart: always
      ports:
        - "27017:27017"
      
      volumes:
        - ./mongo_data:/data/db

#--- Redis ---  
  redis:
    image: redis:alpine
    container_name: redis-bus
    restart: always
    ports:
      - "6379:6379"
